# 临时探测：确认可用的 Go 版本与 CGO 交叉编译可行性，验证完即删
name: probe-build

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.19', '1.20', '1.21', '1.22', '1.23']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - run: go version

      - name: build amd64 (CGO on)
        id: amd64
        continue-on-error: true
        run: CGO_ENABLED=1 go build -o /tmp/x-ui-amd64 main.go

      - name: install arm64 cross toolchain
        if: steps.amd64.outcome == 'success'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: build arm64 (CGO cross)
        id: arm64
        if: steps.amd64.outcome == 'success'
        continue-on-error: true
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc \
            go build -o /tmp/x-ui-arm64 main.go

      - name: summary
        run: |
          echo "### Go ${{ matrix.go }}" >> $GITHUB_STEP_SUMMARY
          echo "- amd64: ${{ steps.amd64.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- arm64: ${{ steps.arm64.outcome || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          file /tmp/x-ui-amd64 2>/dev/null | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY || true
          file /tmp/x-ui-arm64 2>/dev/null | sed 's/^/  /' >> $GITHUB_STEP_SUMMARY || true
