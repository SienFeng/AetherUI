name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅试构建，不会创建 release）'
        required: true
        default: '0.0.0-test'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本: $V"

      # 版本号由 config/config.go 通过 //go:embed 读取，必须在编译前写入
      - name: 写入版本号
        run: |
          printf '%s' "${{ steps.ver.outputs.version }}" > config/version
          echo "config/version = $(cat config/version)"

      - uses: actions/setup-go@v5
        with:
          # Go 版本以 go.mod 为唯一事实来源，避免抬升 go.mod 后
          # 发版工作流还在用旧版本编译。
          go-version-file: go.mod
          cache: false

      # 项目依赖 mattn/go-sqlite3，必须开 CGO，交叉编译需要目标架构的 gcc。
      # libc6-dev-arm64-cross 提供静态链接所需的 libc.a：它只是 gcc-aarch64-linux-gnu
      # 的 Recommends，显式列出以免 apt 配置变化导致静态链接失败。
      - name: 安装 arm64 交叉工具链
        if: matrix.arch == 'arm64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      # 必须静态链接：CI 宿主机的 glibc（ubuntu-latest 现为 2.39）远新于常见部署环境，
      # 动态链接会把宿主 glibc 的符号版本烙进二进制，在 glibc < 2.34 的系统（Ubuntu 20.04、
      # Debian 11 等）上动态链接器解析失败，进程连 main() 都到不了。
      # netgo/osusergo 是静态链接 glibc 的必备配套——否则 DNS 解析与用户查找仍会走 cgo，
      # 运行时去 dlopen NSS 模块而失败（面板拉取订阅、下载 xray 都依赖 DNS）。
      # sqlite_omit_load_extension 去掉 go-sqlite3 对 dlopen 的依赖，本项目不使用该功能。
      - name: 编译
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
          fi
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath \
              -tags "netgo,osusergo,sqlite_omit_load_extension" \
              -ldflags '-s -w -extldflags "-static"' \
              -o a-ui main.go
          file a-ui
          # 链接器在缺少 libc.a 时可能回退到动态链接而不报错，静默发布出去的包
          # 会重现这个问题，因此在这里断言
          if ! file a-ui | grep -q 'statically linked'; then
            echo "::error::a-ui 不是静态链接，将在 glibc 较老的系统上无法启动"
            exit 1
          fi

      - name: 打包
        run: |
          ARCH=${{ matrix.arch }}
          mkdir -p dist/a-ui/bin
          cp a-ui a-ui.service dist/a-ui/
          cp bin/xray-linux-${ARCH} bin/geoip.dat bin/geosite.dat bin/ipdb.dat dist/a-ui/bin/
          chmod +x dist/a-ui/a-ui dist/a-ui/bin/xray-linux-${ARCH}

          # 中文包
          cp a-ui.sh dist/a-ui/
          tar -C dist -czf a-ui-linux-${ARCH}.tar.gz a-ui
          rm dist/a-ui/a-ui.sh

          # 英文包：二进制完全相同，仅 SSH 管理脚本语言不同
          # （面板 Web 界面按浏览器 Accept-Language 自动切换，与打包无关）
          cp a-ui_en.sh dist/a-ui/
          tar -C dist -czf a-ui-linux-${ARCH}-english.tar.gz a-ui

          echo "--- 产物 ---"
          ls -lh ./*.tar.gz
          echo "--- 中文包内容 ---"
          tar -tzvf a-ui-linux-${ARCH}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: a-ui-${{ matrix.arch }}
          path: ./*.tar.gz
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: a-ui-*
          merge-multiple: true

      - name: 创建 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh ./*.tar.gz
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
