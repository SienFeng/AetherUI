name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（仅试构建，不会创建 release）'
        required: true
        default: '0.0.0-test'

jobs:
  build:
    # arm64 在 GitHub 的原生 ARM 构建机上编译，不再装交叉工具链：2026-11-11 发 v1.56.0 时
    # 构建机解析不了 security.ubuntu.com，apt-get install gcc-aarch64-linux-gnu 卡了近 20 分钟后
    # 失败，发版整个卡住。原生构建机自带 gcc 与静态链接用的 libc.a，这一路从此不依赖 apt。
    runs-on: ${{ matrix.runner }}
    # 正常两三分钟编完；挂住时尽早失败，而不是等到默认的 6 小时
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "构建版本: $V"

      # 版本号由 config/config.go 通过 //go:embed 读取，必须在编译前写入
      - name: 写入版本号
        run: |
          printf '%s' "${{ steps.ver.outputs.version }}" > config/version
          echo "config/version = $(cat config/version)"

      - uses: actions/setup-go@v5
        with:
          # Go 版本以 go.mod 为唯一事实来源，避免抬升 go.mod 后
          # 发版工作流还在用旧版本编译。
          go-version-file: go.mod
          cache: false

      # 项目依赖 mattn/go-sqlite3，必须开 CGO。两种架构都在本机架构上编译，用构建机自带的 gcc；
      # 静态链接所需的 libc.a 来自预装的 libc6-dev。缺了的话下面「编译」里的静态链接断言会失败。
      - name: 检查本机编译器
        run: |
          uname -m
          gcc --version | head -1

      # 必须静态链接：CI 宿主机的 glibc（ubuntu-latest 现为 26.04 的 2.43）远新于常见部署环境，
      # 动态链接会把宿主 glibc 的符号版本烙进二进制，在 glibc < 2.34 的系统（Ubuntu 20.04、
      # Debian 11 等）上动态链接器解析失败，进程连 main() 都到不了。
      # netgo/osusergo 是静态链接 glibc 的必备配套——否则 DNS 解析与用户查找仍会走 cgo，
      # 运行时去 dlopen NSS 模块而失败（面板拉取订阅、下载 xray 都依赖 DNS）。
      # sqlite_omit_load_extension 去掉 go-sqlite3 对 dlopen 的依赖，本项目不使用该功能。
      - name: 编译
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build -trimpath \
              -tags "netgo,osusergo,sqlite_omit_load_extension" \
              -ldflags '-s -w -extldflags "-static"' \
              -o a-ui main.go
          file a-ui
          # 链接器在缺少 libc.a 时可能回退到动态链接而不报错，静默发布出去的包
          # 会重现这个问题，因此在这里断言
          if ! file a-ui | grep -q 'statically linked'; then
            echo "::error::a-ui 不是静态链接，将在 glibc 较老的系统上无法启动"
            exit 1
          fi
          # 在目标架构上编译，产物可以当场跑一次：-v 在任何初始化之前返回，不碰数据库
          ./a-ui -v

      - name: 打包
        run: |
          ARCH=${{ matrix.arch }}
          mkdir -p dist/a-ui/bin
          cp a-ui a-ui.service dist/a-ui/
          cp bin/xray-linux-${ARCH} bin/geoip.dat bin/geosite.dat bin/ipdb.dat dist/a-ui/bin/
          chmod +x dist/a-ui/a-ui dist/a-ui/bin/xray-linux-${ARCH}

          # 中文包
          cp a-ui.sh dist/a-ui/
          tar -C dist -czf a-ui-linux-${ARCH}.tar.gz a-ui
          rm dist/a-ui/a-ui.sh

          # 英文包：二进制完全相同，仅 SSH 管理脚本语言不同
          # （面板 Web 界面按浏览器 Accept-Language 自动切换，与打包无关）
          cp a-ui_en.sh dist/a-ui/
          tar -C dist -czf a-ui-linux-${ARCH}-english.tar.gz a-ui

          echo "--- 产物 ---"
          ls -lh ./*.tar.gz
          echo "--- 中文包内容 ---"
          tar -tzvf a-ui-linux-${ARCH}.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: a-ui-${{ matrix.arch }}
          path: ./*.tar.gz
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: a-ui-*
          merge-multiple: true

      # install.sh 的 fetch_release 用 SHA256SUMS 核验下载到的包：没有这个文件的
      # 发布只能退回"仅 TLS 校验 + 警告"。校验和在这里对即将上传的最终产物现算，
      # 不在 build 作业里分开算，保证与 release 里的文件逐字节对应。文件名不带 ./
      # 前缀——脚本按完整文件名精确匹配那一行。
      - name: 生成 SHA256SUMS
        run: |
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: 创建 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh ./*.tar.gz SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
