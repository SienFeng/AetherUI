<!-- 归属地分歧提示的正文：逐个列出各数据源自己的结论，再说明这对地区限制
     意味着什么。

     三个地方要用（访问日志的来源摘要、访问日志表格的归属地列、入站展开行的
     在线明细），逐字一致才有意义——各写一份迟早会分叉，而分叉后差异不会有
     任何东西提醒你。

     参数是持有该行数据的 JS 变量名（"src" / "row" / "online"），Go 模板用
     {{ . }} 把它拼进 Vue 表达式。

     为什么必须写出源名：改动前只说「另一个源认为是 X」。生产上真实吃过亏——
     ip2region 把一个湖北的 IP 判成北京，界面按 Sources() 顺序把它当唯一答案
     显示，看起来像地区限制漏放了一个北京来源，管理员只能自己去查第三方才
     搞清楚是 ip2region 错了。而面板本来就掌握着「两个源分别怎么说」。

     为什么要提并集：地区限制走的是 Multi.CIDRsOfProvinces 的并集，任一源认为
     该段属于所选省份就放行。不写这一句，「限了湖北却放行了一个显示北京的 IP」
     看起来必然像 bug，实际上完全正确。 -->
{{define "ipDivergenceTip"}}
<div v-for="s in {{ . }}.sources" :key="s.source">
    [[ s.source ]]：[[ s.location || '未收录该 IP' ]]<template v-if="s.isp"> · [[ s.isp ]]</template>
</div>
<div v-if="{{ . }}.evidence && {{ . }}.evidence.province" style="margin-top: 6px">
    省级证据：<b>[[ {{ . }}.evidence.province ]]</b>
    [[ {{ . }}.evidence.support ]]/[[ {{ . }}.evidence.total ]] 源支持<template
        v-if="{{ . }}.evidence.conflict">，[[ {{ . }}.evidence.conflict ]] 源给出别的省</template><template
        v-if="{{ . }}.evidence.silent">，[[ {{ . }}.evidence.silent ]] 源没有数据</template>
</div>
<div style="margin-top: 6px; opacity: .75">
    数据源判定不一致。地区限制按<b>并集</b>放行——任一个源认为它属于所选省份即放行。
</div>
{{end}}
