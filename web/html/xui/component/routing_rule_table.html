<!-- 分流规则列表的一行。封禁段与分流段是两个独立的列表（理由见 routing.html
     里那段注释），行的渲染必须逐字一致——各写一份迟早会分叉，而分叉后两段的
     差异不会有任何东西提醒你。

     使用处约定：外层 <li v-for="(rule, index) in blockRules|routeRules"> 提供
     rule 与 index；行本身只是放置目标（dragover/drop 挂在 li 上），可拖的只有
     左侧手柄——整行可拖会干扰行内的开关、菜单和文本选择。 -->
{{define "routingRuleRow"}}
    <span class="rule-lead">
        <a-tooltip :title="ruleFiltering ? '清除筛选与搜索后才能拖动排序' : '拖动调整顺序'">
            <span class="rule-drag-handle" :class="{ 'is-disabled': ruleFiltering }"
                  :draggable="ruleFiltering ? 'false' : 'true'"
                  @dragstart="onRuleDragStart($event, rule)"
                  @dragend="resetRuleDrag"></span>
        </a-tooltip>
        <!-- 序号就是生成期的真实匹配顺序：封禁段整体在前，分流段接着往下数 -->
        <span class="rule-prio" title="匹配顺序">[[ String(ruleOrder(rule)).padStart(2, '0') ]]</span>
    </span>
    <!-- 点这一块就在右侧打开这条规则；开关与菜单是它的兄弟节点，不嵌在按钮里 -->
    <button type="button" class="rv-row-hit" :aria-current="ruleEditor.active && ruleEditor.rule.id === rule.id ? 'true' : null"
            @click="selectRule(rule)">
        <span class="rv-tile" :class="ruleTileClass(rule)" :style="ruleTileStyle(rule)" aria-hidden="true">
            <img v-if="ruleTileKind(rule) === 'brand'"
                 :src="'{{ .base_path }}assets/brand-icons/' + ruleBrand(rule).slug + '.svg?{{ .cur_ver }}'" alt="">
            <a-icon v-else-if="ruleTileKind(rule) === 'block'" type="stop" theme="filled"></a-icon>
            <span v-else class="rv-tile-text">[[ ruleInitials(rule) ]]</span>
        </span>
        <span class="rv-row-text">
            <span class="rv-row-name">
                <span class="rv-row-title">[[ rule.remark || '未命名规则' ]]</span>
                <span v-if="rule.action === 'block'" class="rv-tag is-block">拦截</span>
                <span v-if="!rule.enable" class="rv-tag is-off">已停用</span>
                <span v-else-if="ruleIssue(rule)" class="rv-tag is-warn" :title="ruleIssue(rule)">未生效</span>
            </span>
            <span class="rv-row-sub">
                <template v-if="rule.groupsBroken">域名组数据损坏</template>
                <template v-else>[[ ruleGroupsLabel(rule) ]]</template>
                <template v-if="rule.action !== 'block'">
                    <span class="rv-arrow" aria-hidden="true">→</span><span class="rv-row-dest">[[ ruleDestLabel(rule) ]]</span>
                </template>
            </span>
        </span>
        <span class="rv-upill" :class="{ 'is-all': !rule.broken && !rule.inboundIds.length, 'is-broken': rule.broken }"
              :title="ruleUsersTitle(rule)">
            <a-icon :type="rule.broken ? 'close-circle' : (rule.inboundIds.length ? 'user' : 'global')"></a-icon><span class="rv-upill-txt">[[ ruleUsersLabel(rule) ]]</span><span v-if="ruleAutoNew(rule)" class="rv-upill-new">· 含新增</span>
        </span>
    </button>
    <!-- 后台审计的结论（真实流量有没有按配置走），与上面「生效中/未生效」（配置能不能
         生成）是两回事。只是一个状态图标，不可点——点规则行即可进入详情。停用规则不显示。 -->
    <span v-if="rule.enable && ruleAuditBadges[rule.id]" class="rv-vicon rv-row-audit"
          :class="ruleAuditBadges[rule.id].cls" role="img"
          :title="ruleAuditBadges[rule.id].title" :aria-label="ruleAuditBadges[rule.id].title">
        <a-icon :type="ruleAuditBadges[rule.id].icon" theme="filled" aria-hidden="true"></a-icon>
    </span>
    <button type="button" role="switch" class="rv-switch"
            :aria-checked="rule.enable ? 'true' : 'false'"
            :aria-label="'启用规则「' + (rule.remark || ('#' + rule.id)) + '」'"
            :disabled="ruleToggling === rule.id"
            @click="toggleRuleEnable(rule)"></button>
    <a-dropdown :trigger="['click']">
        <button type="button" class="icon-btn" @click="e => e.preventDefault()"
                :aria-label="'更多操作：' + (rule.remark || '分流规则')"><a-icon type="more"></a-icon></button>
        <a-menu slot="overlay" @click="a => clickRuleAction(a, rule)">
            <a-menu-item key="delete">
                <span style="color: var(--aui-danger)">
                    <a-icon type="delete"></a-icon>删除规则
                </span>
            </a-menu-item>
        </a-menu>
    </a-dropdown>
{{end}}
