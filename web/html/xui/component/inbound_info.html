<!-- 入站详情。改动前每个值都套一个绿色 a-tag（协议、端口、uuid、密码、
     path、加密方式……），整个弹窗是一面绿标签墙。绿色在全站表示「成功 /
     健康」，而这些只是**值**——一个 uuid 没有健康与否可言；全绿的另一个
     后果是里面真正需要注意的项（比如 TLS 未启用）一点都不显眼。
     现在是键值列表，机器可读的值用等宽字体，方便逐字符核对。 -->
{{define "inboundInfoStream"}}
<div class="kv-row">
    <dt>传输</dt>
    <dd>[[ inbound.network ]]</dd>
</div>

<template v-if="inbound.isTcp || inbound.isWs || inbound.isH2">
    <div class="kv-row">
        <dt>host</dt>
        <dd v-if="inbound.host" class="kv-mono">[[ inbound.host ]]</dd>
        <dd v-else class="cell-muted">未设置</dd>
    </div>
    <div class="kv-row">
        <dt>path</dt>
        <dd v-if="inbound.path" class="kv-mono">[[ inbound.path ]]</dd>
        <dd v-else class="cell-muted">未设置</dd>
    </div>
</template>

<template v-if="inbound.isKcp">
    <div class="kv-row">
        <dt>kcp 加密</dt>
        <dd>[[ inbound.kcpType ]]</dd>
    </div>
    <div class="kv-row">
        <dt>kcp 密码</dt>
        <dd class="kv-mono">[[ inbound.kcpSeed ]]</dd>
    </div>
</template>

<template v-if="inbound.isGrpc">
    <div class="kv-row">
        <dt>serviceName</dt>
        <dd class="kv-mono">[[ inbound.serviceName ]]</dd>
    </div>
</template>

<div class="kv-row">
    <dt>TLS</dt>
    <!-- 「未启用」用中性而不是改动前的红色：ws 入站藏在 Caddy 后面由反代
         终结 TLS、以及 REALITY 入站，都是合法且常见的配置，红色会让管理员
         以为自己配错了。 -->
    <dd>
        <span v-if="inbound.tls" class="status-badge status-ok">
            <a-icon type="lock"></a-icon>已启用
        </span>
        <span v-else class="chip">未启用</span>
    </dd>
</div>
<div class="kv-row" v-if="inbound.tls">
    <dt>TLS 域名</dt>
    <dd v-if="inbound.serverName" class="kv-mono">[[ inbound.serverName ]]</dd>
    <!-- 开了 TLS 却没有域名确实值得提醒：证书与 SNI 对不上时客户端会连不上 -->
    <dd v-else>
        <span class="status-badge status-warn"><a-icon type="exclamation-circle"></a-icon>未设置</span>
    </dd>
</div>
{{end}}


{{define "component/inboundInfoComponent"}}
<dl class="kv">
    <div class="kv-row">
        <dt>协议</dt>
        <dd>[[ dbInbound.protocol ]]</dd>
    </div>
    <div class="kv-row">
        <dt>地址</dt>
        <dd class="kv-mono">[[ dbInbound.address ]]</dd>
    </div>
    <div class="kv-row">
        <dt>端口</dt>
        <dd class="kv-mono">[[ dbInbound.port ]]</dd>
    </div>

    <template v-if="dbInbound.isVMess">
        <div class="kv-row">
            <dt>uuid</dt>
            <dd class="kv-mono">[[ inbound.uuid ]]</dd>
        </div>
        <div class="kv-row">
            <dt>alterId</dt>
            <dd class="kv-mono">[[ inbound.alterId ]]</dd>
        </div>
    </template>

    <template v-if="dbInbound.isVLess">
        <div class="kv-row">
            <dt>uuid</dt>
            <dd class="kv-mono">[[ inbound.uuid ]]</dd>
        </div>
        <div class="kv-row" v-if="inbound.visionEnabled">
            <dt>flow</dt>
            <dd class="kv-mono">[[ inbound.flow ]]</dd>
        </div>
    </template>

    <template v-if="dbInbound.isTrojan">
        <div class="kv-row">
            <dt>密码</dt>
            <dd class="kv-mono">[[ inbound.password ]]</dd>
        </div>
    </template>

    <template v-if="dbInbound.isSS">
        <div class="kv-row">
            <dt>加密</dt>
            <dd>[[ inbound.method ]]</dd>
        </div>
        <div class="kv-row">
            <dt>密码</dt>
            <dd class="kv-mono">[[ inbound.password ]]</dd>
        </div>
    </template>

    <template v-if="dbInbound.isSocks">
        <div class="kv-row">
            <dt>用户名</dt>
            <dd class="kv-mono">[[ inbound.username ]]</dd>
        </div>
        <div class="kv-row">
            <dt>密码</dt>
            <dd class="kv-mono">[[ inbound.password ]]</dd>
        </div>
    </template>

    <template v-if="dbInbound.isHTTP">
        <div class="kv-row">
            <dt>用户名</dt>
            <dd class="kv-mono">[[ inbound.username ]]</dd>
        </div>
        <div class="kv-row">
            <dt>密码</dt>
            <dd class="kv-mono">[[ inbound.password ]]</dd>
        </div>
    </template>

    <template v-if="dbInbound.isVMess || dbInbound.isVLess || dbInbound.isTrojan || dbInbound.isSS">
        {{template "inboundInfoStream"}}
    </template>
</dl>
{{end}}

{{define "component/inboundInfo"}}
<script>
    Vue.component('inbound-info', {
        delimiters: ['[[', ']]'],
        props: ["dbInbound", "inbound"],
        template: `{{template "component/inboundInfoComponent"}}`,
    });
</script>
{{end}}
