{{define "component/settingListItem"}}
<!-- 一行设置：左边标题 + 说明，右边控件（与视觉稿 v3 一致）。
     说明常驻在标题下、最多两行；更长的完整内容仍在 ⓘ 里，不删一个字。
     给了 hint 时常驻的只是一句短说明，ⓘ 里放 hint（完整说明）。
     需要重启面板才生效的项带「需重启面板」标签；改过未保存的行左侧一条橙色竖条。 -->
<a-list-item class="setting-row" :class="{ 'is-changed': changed, 'is-stacked': type === 'textarea' }">
    <div class="setting-row-main">
        <div class="setting-row-title">
            <span v-text="title"></span>
            <span v-if="needsRestart" class="setting-badge">需重启面板</span>
            <a-tooltip v-if="fullHint" placement="topLeft" overlay-class-name="setting-hint-tip"
                       :trigger="['hover', 'focus']">
                <template slot="title"><span v-text="fullHint"></span></template>
                <span class="setting-hint" tabindex="0" :aria-label="'完整说明：' + fullHint">
                    <a-icon type="info-circle"></a-icon>
                </span>
            </a-tooltip>
        </div>
        <div v-if="desc" class="setting-row-desc" v-text="desc"></div>
    </div>
    <div class="setting-row-ctl">
        <template v-if="type === 'text'">
            <a-input :value="value" @input="$emit('input', $event.target.value)" :aria-label="title"></a-input>
        </template>
        <template v-else-if="type === 'number'">
            <!-- 设置里的数字都是整数：type=number 的普通输入框能填 1.5，服务端按整数解析时只回一句 ParseInt 错误。 -->
            <a-input-number :value="value" @change="v => $emit('input', v)" :precision="0" :aria-label="title"
                            style="width: 100%"></a-input-number>
        </template>
        <template v-else-if="type === 'switch'">
            <a-switch :checked="value === 1" @change="checked => $emit('input', checked ? 1 : 0)" :aria-label="title"></a-switch>
        </template>
        <template v-else-if="type === 'textarea'">
            <a-textarea :value="value" @input="$emit('input', $event.target.value)" :auto-size="{ minRows: 10, maxRows: 10 }" :aria-label="title"></a-textarea>
        </template>
    </div>
</a-list-item>
{{end}}

{{define "component/settingActionItem"}}
<a-list-item class="setting-row">
    <div class="setting-row-main">
        <div class="setting-row-title">
            <span v-text="title"></span>
            <a-tooltip v-if="hint" placement="topLeft" overlay-class-name="setting-hint-tip"
                       :trigger="['hover', 'focus']">
                <template slot="title"><span v-html="hint"></span></template>
                <span class="setting-hint" tabindex="0" :aria-label="'说明：' + plainHint">
                    <a-icon type="info-circle"></a-icon>
                </span>
            </a-tooltip>
        </div>
        <div v-if="desc" class="setting-row-desc is-full"><span v-html="desc"></span></div>
    </div>
    <div class="setting-row-ctl">
        <slot></slot>
    </div>
</a-list-item>
{{end}}

{{define "component/setting"}}
<script>
    // 说明文字常驻在标题下但最多两行：好几项写了三五行，全部展开整页读起来像
    // 说明书。完整内容在标题旁的 ⓘ 里，悬停或键盘聚焦时弹出，一个字不删。
    // 说明常驻显示在标题下（最多两行），超过 60 字的完整内容另放进 ⓘ。
    // changed：这一项改过、还没保存（由页面按字段比对后传入）。
    Vue.component('setting-list-item', {
        props: ["type", "title", "desc", "hint", "value", "changed"],
        computed: {
            // ⓘ 里的完整说明：显式给了 hint 就用它（desc 只是一句短话）；
            // 没给时沿用原来的规则——desc 超过 60 字才把全文另放进 ⓘ。
            fullHint() {
                if (this.hint) return this.hint;
                return this.desc && this.desc.length > 60 ? this.desc : '';
            },
            // 只认「重启面板」：「重启 xray（约 10 秒后自动完成）」不需要管理员动手
            needsRestart() {
                return /重启面板/.test((this.desc || '') + (this.hint || ''));
            },
        },
        template: `{{template "component/settingListItem"}}`,
    });

    // 与 setting-list-item 同一套两栏栅格，只是右边放按钮/状态而不是输入框。
    // 状态行不用它的话就会退化成「标题、说明、按钮」三行左对齐，
    // 和这个页面上其余的行完全对不齐。
    //
    // desc 是会变的状态（「生成于…收录…」「限速规则已下发」），照旧常驻显示；
    // 静态的解释性文字走 hint，与 setting-list-item 一样收进 ⓘ。两者都可含
    // <code> 等标记，所以用 v-html，读屏用的 aria-label 去掉标记。
    Vue.component('setting-action-item', {
        props: ["title", "desc", "hint"],
        computed: {
            plainHint() {
                return (this.hint || '').replace(/<[^>]+>/g, '');
            },
        },
        template: `{{template "component/settingActionItem"}}`,
    });
</script>
{{end}}
