{{define "accessLogModal"}}
<a-modal id="access-log-modal" v-model="accessLogModal.visible" :title="accessLogModal.title"
         :closable="true" :mask-closable="true" width="1100px" :footer="null">
    <a-alert v-if="!accessLogModal.enabled" type="warning" show-icon style="margin-bottom: 12px"
             message="访问日志未开启"
             description="请到「面板设置 → 访问日志」打开「记录访问日志」。开启后约 10 秒内自动生效，此前发生的访问不会被补记。">
    </a-alert>
    <a-tabs :active-key="accessLogModal.tab" @change="k => accessLogModal.switchTab(k)">
        <a-tab-pane key="detail" tab="明细">
        <a-row :gutter="8" style="margin-bottom: 12px">
            <a-col :span="8">
                <a-input v-model.trim="accessLogModal.ip" placeholder="按来源 IP 过滤" allow-clear
                         @pressEnter="accessLogModal.search()"></a-input>
            </a-col>
            <a-col :span="8">
                <a-input v-model.trim="accessLogModal.key" placeholder="按目标关键字过滤，如 google" allow-clear
                         @pressEnter="accessLogModal.search()"></a-input>
            </a-col>
            <a-col :span="8">
                <a-button type="primary" icon="search" @click="accessLogModal.search()">查询</a-button>
                <span style="margin-left: 12px; white-space: nowrap">
                    <a-switch size="small" :checked="accessLogModal.autoRefresh"
                              @change="on => accessLogModal.toggleAutoRefresh(on)"></a-switch>
                    <span style="margin-left: 6px; color: rgba(0,0,0,.65)">自动刷新</span>
                    <span v-if="accessLogModal.autoRefresh" style="margin-left: 6px; color: rgba(0,0,0,.45)">
                        <a-tooltip v-if="accessLogModal.refreshError">
                            <template slot="title">[[ accessLogModal.refreshError ]]</template>
                            <span style="color: #f5222d; cursor: help">出错</span>
                        </a-tooltip>
                        <a-tooltip v-else-if="accessLogModal.page > 1">
                            <template slot="title">
                                自动刷新只在第一页生效：新记录会不断把列表往下顶，翻着页刷新会让你正在看的行漂走。
                                回到第一页即自动恢复。
                            </template>
                            <span style="cursor: help">已暂停（第 [[ accessLogModal.page ]] 页）</span>
                        </a-tooltip>
                        <span v-else>每 5 秒</span>
                    </span>
                </span>
            </a-col>
        </a-row>
        <div v-if="accessLogModal.sources.length" style="margin-bottom: 12px">
            <span style="color: rgba(0,0,0,.45); margin-right: 8px">近期来源：</span>
            <a-tooltip v-for="src in accessLogModal.sources" :key="src.ip">
                <template slot="title">
                    [[ src.location || '归属地未知' ]]<template v-if="src.locationAlt">（另一个源认为是 [[ src.locationAlt ]]）</template><br>
                    最后出现 [[ DateUtil.formatMillis(src.lastSeen) ]]，共 [[ src.count ]] 条记录
                </template>
                <a-tag style="cursor: pointer; margin-bottom: 4px"
                       :color="accessLogModal.ip === src.ip ? 'blue' : ''"
                       @click="accessLogModal.pickSource(src.ip)">
                    [[ src.ip ]]<span style="opacity: .6"> · [[ src.count ]]</span>
                </a-tag>
            </a-tooltip>
            <a-tag v-if="accessLogModal.ip" style="cursor: pointer; margin-bottom: 4px"
                   @click="accessLogModal.pickSource('')">显示全部</a-tag>
        </div>
        <a-table :columns="accessLogModal.columns" :data-source="accessLogModal.list"
                 :row-key="row => row.id" size="small" :loading="accessLogModal.loading"
                 :pagination="{
                    current: accessLogModal.page,
                    pageSize: accessLogModal.pageSize,
                    total: accessLogModal.total,
                    showTotal: total => '共 ' + total + ' 条'
                 }"
                 :locale="{ emptyText: '没有符合条件的记录' }"
                 @change="p => accessLogModal.goto(p.current)">
            <template slot="time" slot-scope="text, row">
                [[ DateUtil.formatMillis(row.time) ]]
            </template>
            <template slot="location" slot-scope="text, row">
                <a-tooltip v-if="row.locationAlt">
                    <template slot="title">另一个源认为是 [[ row.locationAlt ]]</template>
                    <span style="border-bottom: 1px dashed rgba(0,0,0,.25)">[[ row.location ]]</span>
                </a-tooltip>
                <span v-else-if="row.location">[[ row.location ]]</span>
                <span v-else style="color: rgba(0,0,0,.25)">-</span>
            </template>
            <template slot="target" slot-scope="text, row">
                <a-tag v-if="row.network" color="blue">[[ row.network ]]</a-tag>
                [[ row.target ]]
            </template>
            <template slot="route" slot-scope="text, row">
                <a-tooltip v-if="row.route">
                    <template slot="title">[[ routeTip(row.route) ]]</template>
                    <a-tag :color="routeColor(row.route)">[[ routeLabel(row.route) ]]</a-tag>
                </a-tooltip>
                <a-tag v-else>-</a-tag>
            </template>
        </a-table>
        </a-tab-pane>
        <a-tab-pane key="top" tab="Top 域名">
            <div style="margin-bottom: 12px">
                <a-radio-group :value="accessLogModal.topRange" size="small" button-style="solid"
                               @change="e => accessLogModal.switchRange(e.target.value)">
                    <a-radio-button value="1h">1 小时</a-radio-button>
                    <a-radio-button value="6h">6 小时</a-radio-button>
                    <a-radio-button value="12h">12 小时</a-radio-button>
                    <a-radio-button value="24h">24 小时</a-radio-button>
                    <a-radio-button value="7d">7 天</a-radio-button>
                    <a-radio-button value="15d">15 天</a-radio-button>
                </a-radio-group>
                <span style="margin-left: 12px; color: rgba(0,0,0,.45)">
                    统计的是<b>连接次数</b>，不是流量——上传大文件往往只有很少几条长连接，未必排在前面。
                </span>
            </div>
            <a-table :columns="accessLogModal.topColumns" :data-source="accessLogModal.topList"
                     :row-key="row => row.domain" size="small" :loading="accessLogModal.topLoading"
                     :pagination="false"
                     :locale="{ emptyText: '这个周期内没有统计数据' }">
                <template slot="rank" slot-scope="text, row, index">
                    [[ index + 1 ]]
                </template>
                <template slot="domain" slot-scope="text, row">
                    <a style="cursor: pointer" @click="accessLogModal.drillDown(row.domain)">[[ row.domain ]]</a>
                </template>
            </a-table>
        </a-tab-pane>
    </a-tabs>
</a-modal>
<script>
    const accessLogModal = {
        visible: false,
        loading: false,
        enabled: true,
        // 近期来源：访问日志里出现过的 IP，让「谁来过」不依赖于他此刻是否在线
        sources: [],
        title: '访问日志',
        inboundId: 0,
        ip: '',
        key: '',
        page: 1,
        pageSize: 20,
        total: 0,
        list: [],
        // 自动刷新默认开：这个弹窗的主要用法是盯「他现在在访问什么」，
        // 默认关意味着每次打开都要先点一下开关。复盘「他昨天访问过什么」
        // 时它确实是干扰，但那时把开关关掉即可，而且状态会跨弹窗保留。
        // 它本来就只在第一页生效（见 tick），翻页复盘时自动暂停。
        autoRefresh: true,
        timer: null,
        refreshError: '',
        // 上一次手工查询实际生效的筛选条件。自动刷新用它而不是输入框的当前值：
        // ip / key 是 v-model 实时绑定的，管理员刚敲下「49.90」还没输完，下一轮
        // 自动刷新就会拿这半截条件去查，列表当场变空——他没点过查询，却看到
        // 结果变了。
        appliedIp: '',
        appliedKey: '',
        columns: [{
            title: "时间", align: 'center', width: 160,
            scopedSlots: { customRender: 'time' },
        }, {
            title: "来源 IP", align: 'center', width: 130, dataIndex: "sourceIp",
        }, {
            title: "归属地", align: 'center', width: 170,
            scopedSlots: { customRender: 'location' },
        }, {
            title: "访问目标", align: 'left', scopedSlots: { customRender: 'target' },
        }, {
            title: "走的路由", align: 'center', width: 140,
            scopedSlots: { customRender: 'route' },
        }],
        // tab 与榜单状态。榜单与明细各自独立加载：切到榜单再拉，不给
        // 「只想看明细」的那次打开多发一个请求。
        tab: 'detail',
        topRange: '24h',
        topList: [],
        topLoading: false,
        topLoaded: false,
        topColumns: [{
            title: "#", align: 'center', width: 60,
            scopedSlots: { customRender: 'rank' },
        }, {
            title: "域名", align: 'left',
            scopedSlots: { customRender: 'domain' },
        }, {
            title: "访问次数", align: 'right', width: 120, dataIndex: "count",
        }],

        show({ dbInbound, ip }) {
            this.inboundId = dbInbound.id;
            this.title = `访问日志 - ${dbInbound.remark || dbInbound.tag}`;
            this.ip = ip || '';
            this.key = '';
            this.page = 1;
            this.list = [];
            this.total = 0;
            this.sources = [];
            this.tab = 'detail';
            this.topList = [];
            this.topLoaded = false;
            this.visible = true;
            this.load();
            this.loadSources();
            // 自动刷新的开关状态跨弹窗保留（管理员开过一次就是想一直这么看），
            // 所以每次打开都要按当前状态重新起定时器。
            this.syncTimer();
        },
        // 点标签即按该来源过滤；再点一次「显示全部」清掉过滤。
        pickSource(ip) {
            this.ip = ip;
            this.key = '';
            this.search();
        },
        async loadSources() {
            const msg = await HttpUtil.post(`/aui/inbound/recentSources/${this.inboundId}`);
            if (msg.success) {
                this.sources = msg.obj || [];
            }
        },
        close() {
            this.visible = false;
            this.list = [];
            this.syncTimer();
        },
        search() {
            this.page = 1;
            this.load();
        },
        goto(page) {
            this.page = page;
            this.load();
        },
        // silent 为真时这是一次自动刷新：不转 loading 圈（每 5 秒闪一次很烦）、
        // 不弹全局错误提示、不动分页总数。
        async load({ silent = false } = {}) {
            const url = `/aui/inbound/accessLogs/${this.inboundId}`;
            if (!silent) {
                // 手工查询这一刻，输入框里的值才成为「生效条件」。
                this.appliedIp = this.ip;
                this.appliedKey = this.key;
            }
            const body = {
                ip: this.appliedIp,
                key: this.appliedKey,
                page: this.page,
                pageSize: this.pageSize,
                // 跳过 SELECT COUNT(*)：那是这个查询里最贵的一步（带关键字时是
                // 全表扫描的 LIKE '%kw%'），而自动刷新只在第一页跑，页码和页大小
                // 都不会变，总数对它毫无用处。见 AccessLogQuery.SkipTotal。
                skipTotal: silent,
            };

            let obj;
            if (silent) {
                // 不走 HttpUtil：它每次失败都会弹一条全局提示，5 秒一条很快
                // 就能把屏幕刷满。错误就地显示在开关旁边，与 inbounds.html 的
                // loadOnlineCounts 同一套做法。
                try {
                    const resp = await axios.post(url, body);
                    const data = resp.data;
                    if (!data || !data.success) {
                        this.refreshError = (data && data.msg) || '刷新失败';
                        return;
                    }
                    this.refreshError = '';
                    obj = data.obj;
                } catch (e) {
                    this.refreshError = e.toString();
                    return;
                }
            } else {
                this.loading = true;
                const msg = await HttpUtil.post(url, body);
                this.loading = false;
                if (!msg.success) {
                    return;
                }
                obj = msg.obj;
            }

            this.enabled = obj.enabled;
            this.list = obj.list;
            if (!silent) {
                // total 在 skipTotal 那条路径上恒为 0，表示「本次没统计」而不是
                // 「一条都没有」，照抄会让分页组件当场显示「共 0 条」。
                this.total = obj.total;
                this.page = obj.page;
                this.pageSize = obj.pageSize;
            }
        },
        switchTab(key) {
            // tab 用 :active-key 单向绑定，这里是它唯一的写入点。
            this.tab = key;
            // 首次切到榜单才加载。已经加载过的不重复拉——档位没变时数据
            // 至多也就 10 分钟一变（聚合任务的周期）。
            if (key === 'top' && !this.topLoaded) {
                this.loadTop();
            }
        },
        switchRange(range) {
            this.topRange = range;
            this.loadTop();
        },
        async loadTop() {
            this.topLoading = true;
            const msg = await HttpUtil.post(`/aui/inbound/topDomains/${this.inboundId}`, {
                range: this.topRange,
                limit: 20,
            });
            this.topLoading = false;
            if (!msg.success) {
                return;
            }
            this.topList = msg.obj.list || [];
            this.topRange = msg.obj.range;
            this.topLoaded = true;
        },
        // 点榜单里的域名 = 切回明细并按它过滤。榜单回答「主要在访问什么」，
        // 明细回答「具体哪几次、从哪个 IP」，两步之间不该让管理员手工重打一遍。
        drillDown(domain) {
            this.tab = 'detail';
            this.key = domain;
            this.search();
        },
        toggleAutoRefresh(on) {
            this.autoRefresh = on;
            this.refreshError = '';
            this.syncTimer();
        },
        // 定时器的唯一开关处，先清后设因而幂等：show / close / 切换开关都调它，
        // 不这么做的话反复开关弹窗会叠出多个 interval，页面开几小时后请求频率
        // 会翻好几倍——和展开行的 Chart 实例不销毁是同一类问题。
        syncTimer() {
            if (this.timer != null) {
                clearInterval(this.timer);
                this.timer = null;
            }
            if (this.autoRefresh && this.visible) {
                this.timer = setInterval(() => this.tick(), ACCESS_LOG_REFRESH_MS);
            }
        },
        tick() {
            // 标签页切到后台就不发请求，切回来自动继续。定时器留着不清：
            // 这里要的是「暂停」而不是「关闭」，管理员没做过任何操作。
            if (document.hidden) {
                return;
            }
            // 只在第一页刷新。翻页时新记录会不断把列表往下顶，正在看的那行
            // 会漂走；回到第一页自动恢复，界面上有对应提示。
            if (this.page !== 1) {
                return;
            }
            this.load({ silent: true });
        },
    };

    // 自动刷新周期。上限由后端决定：AccessLogCollectJob 是 @every 5s
    // （web/web.go），日志最快也是 5 秒才进库一批，刷得更快只是反复
    // 拿回同一批数据。
    const ACCESS_LOG_REFRESH_MS = 5000;

    // 生成的出站 tag 一律带 a-ui- 前缀（model.OutboundTagPrefix），
    // 与用户手写模板里的 tag 隔离。
    const A_UI_PREFIX = 'a-ui-';
    const ROUTE_BLOCK = 'a-ui-block';
    const ROUTE_DEFAULT = 'a-ui-default';

    // 路由串经过中间出站时形如 "proxy-hk -> direct"，此时整串照原样显示：
    // 拆开只取一段会把"经过了谁"这个信息丢掉。
    function routeIsChained(route) {
        return route.indexOf(' -> ') >= 0 || route.indexOf(' >> ') >= 0;
    }

    new Vue({
        delimiters: ['[[', ']]'],
        el: '#access-log-modal',
        data: { accessLogModal },
        watch: {
            // 弹窗是 v-model 绑定 visible 的，点右上角 X 或点遮罩关闭时都不会
            // 走 close()。只有这个 watch 能保证定时器一定被清掉——否则弹窗关了
            // 之后请求还在后台每 5 秒发一次，管理员完全看不到。
            'accessLogModal.visible'() {
                accessLogModal.syncTimer();
            },
        },
        methods: {
            routeColor(route) {
                if (routeIsChained(route)) return 'orange';
                if (route === ROUTE_BLOCK) return 'red';
                if (route === ROUTE_DEFAULT) return 'blue';
                // 其余 a-ui- 开头的都是分流命中的出站节点
                if (route.startsWith(A_UI_PREFIX)) return 'green';
                // 用户手写模板里的出站，既不是直连也不是本面板生成的
                return 'purple';
            },
            routeLabel(route) {
                if (routeIsChained(route)) return route;
                if (route === ROUTE_BLOCK) return '已阻断';
                if (route === ROUTE_DEFAULT) return '直连';
                // 去掉前缀，与出站节点的备注对得上，列宽也省下来
                if (route.startsWith(A_UI_PREFIX)) return route.slice(A_UI_PREFIX.length);
                return route;
            },
            routeTip(route) {
                if (routeIsChained(route)) return '经过多级出站：' + route;
                if (route === ROUTE_BLOCK) {
                    return '命中封禁规则或地区限制，流量已被丢弃（出站 ' + route + '）';
                }
                if (route === ROUTE_DEFAULT) {
                    return '未命中任何分流规则，走默认出站（' + route + '），也就是本机直连';
                }
                if (route.startsWith(A_UI_PREFIX)) {
                    return '命中分流规则，走出站节点 ' + route;
                }
                return '走模板中自定义的出站 ' + route;
            },
        },
    });
</script>
{{end}}
