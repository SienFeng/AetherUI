<!DOCTYPE html>
<html lang="en">
{{template "head" .}}
<style>
    @media (min-width: 769px) {
        .ant-layout-content {
            margin: 24px 16px;
        }
    }

    .ant-col-sm-24 {
        margin-top: 10px;
    }

    .ant-tabs-bar {
        margin: 0;
    }

    .ant-list-item {
        display: block;
    }

    .ant-tabs-top-bar {
        background: white;
    }
</style>
<style>
    .setting-action-col {
        text-align: left;
        margin-top: 8px;
    }

    @media (min-width: 1200px) {
        /* 宽屏下与右侧的输入框列对齐；窄屏时栅格会换行，此时左对齐才自然 */
        .setting-action-col {
            text-align: right;
            margin-top: 0;
        }
    }
</style>
<body>
<a-layout id="app" v-cloak>
    {{ template "commonSider" . }}
    <a-layout id="content-layout">
        <a-layout-content>
            <a-spin :spinning="spinning" :delay="500" tip="loading">
                <a-space direction="vertical">
                    <a-space direction="horizontal">
                        <a-button type="primary" :disabled="saveBtnDisable" @click="updateAllSetting">保存配置</a-button>
                        <a-button type="danger" :disabled="!saveBtnDisable" @click="restartPanel">重启面板</a-button>
                    </a-space>
                    <a-tabs default-active-key="1">
                        <a-tab-pane key="1" tab="面板配置">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-list-item type="text" title="面板监听 IP" desc="默认留空监听所有 IP，重启面板生效" v-model="allSetting.webListen"></setting-list-item>
                                <setting-list-item type="number" title="面板监听端口" desc="重启面板生效" v-model.number="allSetting.webPort"></setting-list-item>
                                <setting-list-item type="text" title="面板证书公钥文件路径" desc="填写一个 '/' 开头的绝对路径，重启面板生效" v-model="allSetting.webCertFile"></setting-list-item>
                                <setting-list-item type="text" title="面板证书密钥文件路径" desc="填写一个 '/' 开头的绝对路径，重启面板生效" v-model="allSetting.webKeyFile"></setting-list-item>
                                <setting-list-item type="text" title="面板 url 根路径" desc="必须以 '/' 开头，以 '/' 结尾，重启面板生效" v-model="allSetting.webBasePath"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                        <a-tab-pane key="2" tab="用户设置">
                            <a-form style="background: white; padding: 20px">
                                <a-form-item label="原用户名">
                                    <a-input v-model="user.oldUsername" style="max-width: 300px"></a-input>
                                </a-form-item>
                                <a-form-item label="原密码">
                                    <a-input type="password" v-model="user.oldPassword"
                                             style="max-width: 300px"></a-input>
                                </a-form-item>
                                <a-form-item label="新用户名">
                                    <a-input v-model="user.newUsername" style="max-width: 300px"></a-input>
                                </a-form-item>
                                <a-form-item label="新密码">
                                    <a-input type="password" v-model="user.newPassword"
                                             style="max-width: 300px"></a-input>
                                </a-form-item>
                                <a-form-item>
                                    <a-button type="primary" @click="updateUser">修改</a-button>
                                </a-form-item>
                            </a-form>
                        </a-tab-pane>
                        <a-tab-pane key="3" tab="xray 相关设置">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-list-item type="textarea" title="xray 配置模版" desc="以该模版为基础生成最终的 xray 配置文件，重启面板生效" v-model="allSetting.xrayTemplateConfig"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                        <a-tab-pane key="4" tab="IP 归属地库">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-action-item v-for="src in ipdb.sources" :key="src.key"
                                                     :title="src.name" :desc="ipdbSourceDesc(src)">
                                    <a-tag v-if="!src.enabled">未启用</a-tag>
                                    <a-tag v-else-if="src.loaded" color="green">已加载</a-tag>
                                    <a-tag v-else color="red">未下载</a-tag>
                                    <a-button type="primary" size="small" style="margin-left: 8px"
                                              :disabled="!src.enabled"
                                              :loading="ipdbUpdating === src.key"
                                              @click="updateIPDB(src.key)">更新</a-button>
                                </setting-action-item>
                                <setting-action-item title="更新全部数据源" desc="">
                                    <a-button type="primary" :loading="ipdbUpdating === 'all'"
                                              @click="updateIPDB('')">立即更新全部</a-button>
                                </setting-action-item>
                                <setting-list-item type="text" title="ip2region 源地址"
                                                   desc="源数据约 35 MB，留空表示不启用"
                                                   v-model.trim="allSetting.ipdbSourceUrl"></setting-list-item>
                                <setting-list-item type="text" title="纯真库源地址"
                                                   desc="源数据约 25 MB，留空表示不启用。两个源不能都留空"
                                                   v-model.trim="allSetting.qqwrySourceUrl"></setting-list-item>
                                <setting-list-item type="text" title="每日更新时刻"
                                                   desc="格式 HH:MM，例如 04:00。留空表示关闭自动更新"
                                                   v-model.trim="allSetting.ipdbUpdateTime"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                        <a-tab-pane key="5" tab="访问日志">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-list-item type="switch" title="记录访问日志"
                                                   desc="记录用户在什么时间访问了什么目标、走的哪条路由。开关变化约 10 秒后生效"
                                                   v-model="allSetting.accessLogEnable"></setting-list-item>
                                <setting-list-item type="number" title="日志保留天数"
                                                   desc="超过该天数的记录每小时自动清除"
                                                   v-model.number="allSetting.accessLogRetentionDays"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                        <a-tab-pane key="8" tab="并发限制">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-list-item type="number" title="闲置超时（秒）"
                                                   desc="连接仍在但连续这么久没有任何流量，就不再占用并发额度。0 表示关闭（连接不断开就一直占名额）。建议 120，可填 0 或 30 ~ 86400"
                                                   v-model.number="allSetting.concurrencyIdleTimeout"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                        <a-tab-pane key="6" tab="端口限速">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-action-item title="限速状态" :desc="shapingDesc()">
                                    <a-tag v-if="!shaping.supported" color="red">不支持</a-tag>
                                    <a-tag v-else-if="shaping.rolledBack" color="red">已自动撤销</a-tag>
                                    <a-tag v-else-if="shaping.active" color="green">已生效</a-tag>
                                    <a-tag v-else>未启用</a-tag>
                                </setting-action-item>
                                <setting-action-item title="清除全部限速"
                                                     desc="入站上的限速值不会被清空，约 10 秒后会重新下发。若限速把网络掐断导致面板打不开，请从控制台执行 <code>./a-ui tc-clear</code>">
                                    <a-button type="danger" :loading="shapingClearing" @click="clearShaping">
                                        清除全部限速
                                    </a-button>
                                </setting-action-item>
                                <setting-list-item type="text" title="限速网卡"
                                                   desc="留空则按默认路由自动探测。多网卡机器可手动指定"
                                                   v-model.trim="allSetting.tcInterface"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                        <a-tab-pane key="7" tab="其他设置">
                            <a-list item-layout="horizontal" style="background: white">
                                <setting-list-item type="text" title="时区" desc="定时任务按照该时区的时间运行，重启面板生效" v-model="allSetting.timeLocation"></setting-list-item>
                                <setting-list-item type="text" title="订阅更新时间"
                                                   desc="域名组订阅每天在该时刻自动更新，格式 HH:MM，最多 10 分钟内生效，无需重启面板"
                                                   v-model="allSetting.subscriptionUpdateTime"></setting-list-item>
                            </a-list>
                        </a-tab-pane>
                    </a-tabs>
                </a-space>
            </a-spin>
        </a-layout-content>
    </a-layout>
</a-layout>
{{template "js" .}}
{{template "component/setting"}}
<script>

    const app = new Vue({
        delimiters: ['[[', ']]'],
        el: '#app',
        data: {
            siderDrawer,
            spinning: false,
            oldAllSetting: new AllSetting(),
            allSetting: new AllSetting(),
            saveBtnDisable: true,
            user: {},
            ipdb: { sources: [], updateTime: '' },
            ipdbUpdating: null,
            shaping: { supported: false, active: false, interface: '', rolledBack: false, reason: '' },
            shapingClearing: false,
        },
        methods: {
            loading(spinning = true) {
                this.spinning = spinning;
            },
            async getAllSetting() {
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/all");
                this.loading(false);
                if (msg.success) {
                    this.oldAllSetting = new AllSetting(msg.obj);
                    this.allSetting = new AllSetting(msg.obj);
                    this.saveBtnDisable = true;
                }
            },
            async updateAllSetting() {
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/update", this.allSetting);
                this.loading(false);
                if (msg.success) {
                    await this.getAllSetting();
                }
            },
            async getIPDBStatus() {
                const msg = await HttpUtil.post("/xui/setting/ipdbStatus");
                if (msg.success) {
                    this.ipdb = msg.obj;
                }
            },
            shapingDesc() {
                if (!this.shaping.supported || this.shaping.rolledBack) {
                    return this.shaping.reason;
                }
                if (this.shaping.active) {
                    return `限速规则已下发，网卡：${this.shaping.interface || '未知'}`;
                }
                return '当前没有入站配置限速，未对系统的队列规则做任何改动';
            },
            ipdbSourceDesc(src) {
                if (!src.enabled) {
                    return '源地址留空，该数据源未启用';
                }
                if (!src.loaded) {
                    return '尚未下载，点击右侧「更新」获取';
                }
                return `生成于 ${DateUtil.formatMillis(src.builtAt)}，`
                     + `收录 ${src.segmentCount} 个 IP 段、${src.provinceCount} 个省级地区`;
            },
            async getShapingStatus() {
                const msg = await HttpUtil.post('/xui/setting/shapingStatus');
                if (msg.success) {
                    this.shaping = msg.obj;
                }
            },
            clearShaping() {
                this.$confirm({
                    title: '清除全部限速',
                    content: '将撤销本面板下发的所有 tc 队列规则并删除专用的 ifb 网卡。' +
                             '入站上配置的限速值不会被清空，下一轮（约 10 秒）会重新下发。',
                    okText: '清除',
                    cancelText: '取消',
                    onOk: async () => {
                        this.shapingClearing = true;
                        await HttpUtil.post('/xui/setting/clearShaping');
                        this.shapingClearing = false;
                        await this.getShapingStatus();
                    },
                });
            },
            async updateIPDB(key) {
                // 全量要下载约 60 MB 再重建，慢速网络下可能要好几分钟，
                // 这里只锁对应的按钮不锁整页，避免管理员以为面板卡死。
                this.ipdbUpdating = key || 'all';
                const msg = await HttpUtil.post("/xui/setting/updateIPDB", { key: key || '' });
                this.ipdbUpdating = null;
                if (msg.success) {
                    const { updated, upToDate } = msg.obj;
                    // 「上游没变，不必重下」与「更新了 0 个」是两回事，
                    // 混成一句话会让管理员以为更新失败了。
                    let text;
                    if (updated > 0 && upToDate > 0) {
                        text = `已更新 ${updated} 个数据源，${upToDate} 个已是最新`;
                    } else if (updated === 0 && upToDate > 0) {
                        text = `已是最新版本，无需更新`;
                    } else {
                        text = `已更新 ${updated} 个数据源`;
                    }
                    this.$message.success(text);
                    await this.getIPDBStatus();
                }
            },
            async updateUser() {
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/updateUser", this.user);
                this.loading(false);
                if (msg.success) {
                    this.user = {};
                }
            },
            async restartPanel() {
                await new Promise(resolve => {
                    this.$confirm({
                        title: '重启面板',
                        content: '确定要重启面板吗？点击确定将于 3 秒后重启，若重启后无法访问面板，请前往服务器查看面板日志信息',
                        okText: '确定',
                        cancelText: '取消',
                        onOk: () => resolve(),
                    });
                });
                this.loading(true);
                const msg = await HttpUtil.post("/xui/setting/restartPanel");
                this.loading(false);
                if (msg.success) {
                    this.loading(true);
                    await PromiseUtil.sleep(5000);
                    location.reload();
                }
            }
        },
        async mounted() {
            await this.getAllSetting();
            // 必须在下面那个死循环之前调用
            await this.getIPDBStatus();
            await this.getShapingStatus();
            while (true) {
                await PromiseUtil.sleep(1000);
                this.saveBtnDisable = this.oldAllSetting.equals(this.allSetting);
            }
        },
    });

</script>
</body>
</html>
