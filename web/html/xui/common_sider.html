{{define "menuItems"}}
<!-- 分组：概览 / 管理 / 其他。sider 与窄屏抽屉共用这一份。
     面板设置是对面板自身的配置，不是日常管理的对象，放在「其他」里、退出登录之上。 -->
<a-menu-item-group title="概览">
    <a-menu-item key="{{ .base_path }}aui/">
        <a-icon type="dashboard"></a-icon>
        <span>系统状态</span>
    </a-menu-item>
</a-menu-item-group>
<a-menu-item-group title="管理">
    <a-menu-item key="{{ .base_path }}aui/inbounds">
        <a-icon type="user"></a-icon>
        <!-- 提醒点：有启用入站 7 天内到期，或近 24 小时被地区限制拦截（inbound-attention.js 每 5 分钟拉一次）。
             与分流管理的红点同一写法：点本身读屏读不到，数量另写一份 sr-only 文字。 -->
        <a-badge :dot="inboundAttention.alertCount > 0">
            <span :title="inboundAttention.alertCount > 0 ? inboundAttention.alertCount + ' 个入站即将到期或被地区限制拦截' : undefined">入站列表</span>
        </a-badge>
        <span v-if="inboundAttention.alertCount > 0" class="sr-only">（[[ inboundAttention.alertCount ]] 个入站即将到期或被地区限制拦截）</span>
    </a-menu-item>
    <a-menu-item key="{{ .base_path }}aui/routing">
        <a-icon type="fork"></a-icon>
        <!-- 红点：有启用规则的真实流量与配置不符（routing-audit.js 每 60s 拉一次摘要）。
             点本身读屏读不到，数量另写一份 sr-only 文字。 -->
        <a-badge :dot="routingAudit.mismatchCount > 0">
            <span :title="routingAudit.mismatchCount > 0 ? routingAudit.mismatchCount + ' 条规则存在走错的流量' : undefined">分流管理</span>
        </a-badge>
        <span v-if="routingAudit.mismatchCount > 0" class="sr-only">（[[ routingAudit.mismatchCount ]] 条规则存在走错的流量）</span>
    </a-menu-item>
</a-menu-item-group>
<a-menu-item-group title="其他">
    <a-menu-item key="{{ .base_path }}aui/setting">
        <a-icon type="setting"></a-icon>
        <span>面板设置</span>
    </a-menu-item>
    <a-menu-item key="{{ .base_path }}logout">
        <a-icon type="logout"></a-icon>
        <span>退出登录</span>
    </a-menu-item>
</a-menu-item-group>
{{end}}


{{define "commonSider"}}
<!-- width 200：菜单项最长四个字，加上图标与左右留白，160 显得局促；
     入站列表那张表的列多，200 是在两者之间的折中。布局是 flex，
     内容区会自动变宽，没有任何一处硬编码过侧栏宽度。 -->
<a-layout-sider id="sider" collapsible breakpoint="md" collapsed-width="0" :width="200">
    <!-- 品牌头。改动前侧栏顶部直接就是第一个菜单项，整个面板没有一处写着
         自己叫什么。标识与登录页同一个文件（assets/logo.svg）。
         alt 留空：紧挨着就是「AetherUI」这几个字，读屏软件念两遍是噪音。 -->
    <div class="sider-brand">
        <img class="sider-brand-mark" src="{{ .base_path }}assets/logo.svg?{{ .cur_ver }}" alt="">
        <span class="sider-brand-name">AetherUI</span>
    </div>
    <!-- 浅色侧栏：颜色留给数据和状态，导航本身退到背景里。
         与窄屏抽屉（下方 #sider-drawer）同为 light，两处不再是两套配色。 -->
    <a-menu theme="light" mode="inline" :selected-keys="['{{ .request_uri }}']"
            @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
        {{template "menuItems" .}}
    </a-menu>
    <div class="sider-version">
        <a-popover v-model="versionPopoverVisible" trigger="click" placement="topRight"
                   overlay-class-name="version-popover">
            <template slot="content">
                <div class="version-panel">
                    <div class="version-panel-head">
                        <span>当前版本</span>
                        <a-icon type="sync" :spin="versionRefreshing"
                                @click="refreshPanelVersion()"></a-icon>
                    </div>
                    <div class="version-panel-body">
                        <div class="version-current">
                            [[ panelVersion.current ]]
                            <a-icon v-if="panelVersion.knownCurrent && !panelVersion.hasUpdate"
                                    type="check-circle" theme="filled" style="color:var(--aui-success)"></a-icon>
                        </div>
                        <div class="version-state">[[ versionStateText() ]]</div>
                        <div v-if="panelVersion.lastError" class="version-error">
                            [[ panelVersion.lastError ]]
                        </div>
                        <a-button v-if="panelVersion.hasUpdate && panelVersion.updatable"
                                  type="primary" size="small" style="margin-top:8px"
                                  @click="confirmUpgrade(panelVersion.latest, false)">
                            更新到 [[ panelVersion.latest ]]
                        </a-button>
                        <div v-if="!panelVersion.updatable && panelVersion.unsupportedReason"
                             class="version-unsupported">
                            [[ panelVersion.unsupportedReason ]]
                        </div>
                    </div>
                    <div v-if="panelVersion.updatable && (panelVersion.releases || []).length"
                         class="version-rollback">
                        <div class="version-rollback-head" @click="rollbackOpen = !rollbackOpen">
                            <span><a-icon type="clock-circle"></a-icon> 版本回退</span>
                            <a-icon :type="rollbackOpen ? 'up' : 'down'"></a-icon>
                        </div>
                        <div v-if="rollbackOpen">
                            <div class="version-rollback-tip">
                                选择要回退到的版本（近 [[ panelVersion.releases.length ]] 个版本）
                            </div>
                            <a-radio-group v-model="rollbackTag" class="version-rollback-list">
                                <div v-for="r in panelVersion.releases" :key="r.tagName"
                                     class="version-rollback-item">
                                    <a-radio :value="r.tagName">[[ r.tagName ]]</a-radio>
                                    <span class="version-rollback-date">
                                        [[ formatReleaseDate(r.publishedAt) ]]
                                    </span>
                                </div>
                            </a-radio-group>
                            <a-button size="small" :disabled="!rollbackTag"
                                      style="margin-top:8px;width:100%"
                                      @click="confirmUpgrade(rollbackTag, true)">
                                回退到选中版本
                            </a-button>
                        </div>
                    </div>
                </div>
            </template>
            <a-badge :dot="panelVersion.hasUpdate">
                <span class="sider-version-tag">[[ panelVersion.current || '—' ]]</span>
            </a-badge>
        </a-popover>
    </div>
</a-layout-sider>
<a-modal :visible="upgradeState !== 'idle'"
         :closable="false" :mask-closable="false" :footer="null" :width="460">
    <template slot="title">
        <div class="modal-head">
            <span class="modal-icon tone-blue" aria-hidden="true"><a-icon type="cloud-download"></a-icon></span>
            <span class="modal-head-text">
                <span class="modal-head-title">[[ '面板更新' ]]</span>
                <span class="modal-head-sub">更新在后台独立进程中执行</span>
            </span>
        </div>
    </template>

    <div style="text-align:center;padding:12px 0">
        <template v-if="upgradeState === 'starting'">
            <a-spin size="large"></a-spin>
            <p style="margin-top:16px">正在更新到 [[ upgradeTarget ]]…</p>
            <p style="color:var(--aui-text-3);font-size:12px">
                更新在后台独立进程中执行，请不要关闭此页面
            </p>
        </template>
        <template v-else-if="upgradeState === 'restarting'">
            <a-spin size="large"></a-spin>
            <p style="margin-top:16px">面板重启中…</p>
            <p style="color:var(--aui-text-3);font-size:12px">这是更新过程中的正常现象</p>
        </template>
        <template v-else-if="upgradeState === 'done'">
            <a-icon type="check-circle" theme="filled"
                    style="font-size:48px;color:var(--aui-success)"></a-icon>
            <!-- 版本号读不到时绝不能沿用「当前版本 X」那句：那个位置显示的是
                 panelVersion.current，此路径下它还是更新前的旧值，照原样显示
                 等于报一个假版本号。 -->
            <template v-if="upgradeVersionUnverified">
                <p style="margin-top:16px">[[ upgradeTarget ]] 已安装完成，面板已重启</p>
                <p style="color:var(--aui-text-3);font-size:12px">
                    该版本不提供版本查询接口，无法在这里核对版本号，
                    侧栏底部的版本入口也会随之消失。
                    此后如需再切换版本，请在服务器上执行 <b>a-ui update</b>。
                </p>
            </template>
            <p v-else style="margin-top:16px">更新完成，当前版本 [[ panelVersion.current ]]</p>
            <a-button type="primary" @click="location.reload()">刷新页面</a-button>
        </template>
        <template v-else-if="upgradeState === 'relogin'">
            <a-icon type="check-circle" theme="filled"
                    style="font-size:48px;color:var(--aui-success)"></a-icon>
            <p style="margin-top:16px">面板已重启完成，需要重新登录</p>
            <p style="color:var(--aui-text-3);font-size:12px">
                目标版本 [[ upgradeTarget ]] 不再承认当前的登录状态，这在跨版本更新或回退时是正常的。
                重新登录后可在侧栏确认当前版本。
            </p>
            <a-button type="primary" @click="location.reload()">重新登录</a-button>
        </template>
        <template v-else-if="upgradeState === 'timeout'">
            <a-icon type="exclamation-circle" theme="filled"
                    style="font-size:48px;color:var(--aui-warning)"></a-icon>
            <p style="margin-top:16px">3 分钟内版本号仍未变化</p>
            <p style="color:var(--aui-text-3);font-size:12px">
                更新可能仍在进行中（慢速网络下载发版包可能超过 3 分钟），也可能已经失败。
                <b>请不要重复点击更新</b>，先查看日志确认。
            </p>
            <p style="color:var(--aui-text-3);font-size:12px">
                若是登录态已失效导致查询中断，刷新页面重新登录即可确认当前版本。
            </p>
            <a-button style="margin-right:8px" @click="openUpgradeLog()">查看日志</a-button>
            <a-button @click="upgradeState = 'idle'">关闭</a-button>
        </template>
    </div>
</a-modal>

<a-modal v-model="upgradeLogVisible" :footer="null" :width="800">
    <template slot="title">
        <div class="modal-head">
            <span class="modal-icon tone-blue" aria-hidden="true"><a-icon type="file-text"></a-icon></span>
            <span class="modal-head-text">
                <span class="modal-head-title">[[ '更新日志' ]]</span>
                <span class="modal-head-sub">服务器上 /var/log/a-ui-update.log 的最后 200 行</span>
            </span>
        </div>
    </template>

    <pre class="upgrade-log"><template v-for="line in upgradeLogLines">[[ line ]]
</template></pre>
    <div v-if="!upgradeLogLines.length" style="color:var(--aui-text-3)">
        日志为空，说明还没有执行过更新
    </div>
</a-modal>
<a-drawer id="sider-drawer" placement="left" :closable="false"
          @close="siderDrawer.close()"
          :visible="siderDrawer.visible" :wrap-style="{ padding: 0 }">
    <!-- 改成 <button>：这是小屏上打开导航的唯一入口（侧栏在 md 断点下
         collapsed-width="0" 会整个消失），而 div + @click 键盘完全拿不到。 -->
    <button type="button" class="drawer-handle" @click="siderDrawer.change()" slot="handle"
            :aria-label="siderDrawer.visible ? '关闭导航菜单' : '打开导航菜单'"
            :aria-expanded="siderDrawer.visible ? 'true' : 'false'">
        <a-icon :type="siderDrawer.visible ? 'close' : 'menu-fold'"></a-icon>
    </button>
    <a-menu theme="light" mode="inline" :selected-keys="['{{ .request_uri }}']"
        @click="({key}) => key.startsWith('http') ? window.open(key) : location.href = key">
        {{template "menuItems" .}}
    </a-menu>
</a-drawer>
<script>

    const siderDrawer = {
        visible: false,
        show() {
            this.visible = true;
        },
        close() {
            this.visible = false;
        },
        change() {
            this.visible = !this.visible;
        }
    };

</script>
{{end}}
