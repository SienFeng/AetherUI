{{define "form/streamWS"}}
<a-col :span="12">
    <a-form-item label="路径">
        <a-input v-model.trim="inbound.stream.ws.path"></a-input>
    </a-form-item>
</a-col>
<a-col :span="12">
    <a-form-item>
        <span slot="label">
            接收 PROXY protocol
            <a-tooltip>
                <template slot="title">
                    只有本入站确实由 VLESS/Trojan 的 fallback（xver=1 或 2）、<br/>
                    或支持 PROXY protocol 的反代转发时才能打开。<br/>
                    <b>直连的客户端不发这段头，打开后会一直握手失败</b>，<br/>
                    而 xray 的配置校验照样通过、面板照样显示运行中，看不出问题。<br/>
                    作用是让本入站拿到真实客户端 IP 而不是前一跳的地址——<br/>
                    地区限制、并发限制、IP 封禁、访问日志都依赖它。
                </template>
                <a-icon type="question-circle" theme="filled"></a-icon>
            </a-tooltip>
        </span>
        <a-switch v-model="inbound.stream.ws.acceptProxyProtocol"></a-switch>
    </a-form-item>
</a-col>
<a-col :span="24">
    <a-form-item label="请求头">
        <!-- + 按钮与输入组列表用 flex 并排：按钮居左并 align-items:center 垂直
             居中于整块请求头（与「请求头：」标签同一水平线——该标签的居中来自
             custom.css 里 #inbound-modal .ant-form-horizontal .ant-form-item
             的 display:flex + align-items:center），不论有几行都保持居中。
             所有名称/值输入组装进右侧同一个容器内竖排（各组 display:block），
             这样多行时它们的左边缘互相对齐。容器的 margin-bottom:-8px 用来抵消
             最后一组的 margin-bottom，否则居中会被那 8px 带偏 4px。
             名称多为 Host 这类短词，值多为域名，所以组内宽度按 36/64 倾斜给
             「值」。addHeader/removeHeader 调用与 header.name/header.value
             绑定未改动，只是外层排列方式。 -->
        <div style="display: flex; align-items: center;">
            <a-button size="small" style="flex: none; margin-right: 8px;"
                      @click="inbound.stream.ws.addHeader('Host', '')">
                +
            </a-button>
            <div style="flex: none; margin-bottom: -8px;">
                <a-input-group v-for="(header, index) in inbound.stream.ws.headers"
                                style="display: block; width: 480px; margin-bottom: 8px;">
                    <a-input style="width: 36%" v-model.trim="header.name"
                             addon-before="名称"></a-input>
                    <a-input style="width: 64%" v-model.trim="header.value"
                             addon-before="值">
                        <template slot="addonAfter">
                            <a-button size="small"
                                      @click="inbound.stream.ws.removeHeader(index)">
                                -
                            </a-button>
                        </template>
                    </a-input>
                </a-input-group>
            </div>
        </div>
    </a-form-item>
</a-col>
{{end}}
