{{define "form/http"}}
<a-form layout="horizontal" :label-col="{ span: 7 }" :wrapper-col="{ span: 16 }">
    <a-row :gutter="16">
        <a-col :span="12">
            <a-form-item label="用户名">
                <a-input v-model.trim="inbound.settings.accounts[0].user"></a-input>
            </a-form-item>
        </a-col>
        <a-col :span="12">
            <a-form-item label="密码">
                <a-input v-model.trim="inbound.settings.accounts[0].pass"></a-input>
            </a-form-item>
        </a-col>
    </a-row>
</a-form>
{{end}}
