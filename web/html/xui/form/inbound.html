{{define "form/inbound"}}
<!-- 已被当前 Xray 核心移除的配置项。不显式标出来的话，对应下拉会显示空白，
     用户随手一保存就把配置静默改成别的。 -->
<a-alert v-if="inbound.deprecatedFeatures.length > 0" type="error" show-icon
         style="margin-bottom: 12px;"
         message="此入站使用了当前 Xray 核心已移除的配置，必须修改后才能保存">
    <template slot="description">
        <div v-for="d in inbound.deprecatedFeatures" :key="d.field + d.value">
            [[ d.field ]]：<b>[[ d.value ]]</b> —— [[ d.fix ]]
        </div>
    </template>
</a-alert>

<!-- 基本信息 -->
<div class="form-section">
    <div class="form-section-title">基本信息</div>
    <a-form layout="horizontal">
        <a-row :gutter="16">
            <a-col :span="12">
                <a-form-item label='{{ i18n "remark" }}'>
                    <a-input v-model.trim="dbInbound.remark"></a-input>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item label='{{ i18n "enable" }}'>
                    <a-switch v-model="dbInbound.enable"></a-switch>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item label='{{ i18n "protocol" }}'>
                    <a-select v-model="inbound.protocol" style="width: 100%;">
                        <a-select-option v-for="p in Protocols" :key="p" :value="p">[[ p ]]</a-select-option>
                    </a-select>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item>
                    <span slot="label">
                        监听 IP
                        <a-tooltip>
                            <template slot="title">
                                默认留空即可
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-input v-model.trim="inbound.listen"></a-input>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item label="端口">
                    <a-input-number v-model="inbound.port" :precision="0" style="width: 100%;"></a-input-number>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item>
                    <span slot="label">
                        总流量(GB)
                        <a-tooltip>
                            <template slot="title">
                                0 表示不限制
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-input-number v-model="dbInbound.totalGB" :min="0" style="width: 100%;"></a-input-number>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item>
                    <span slot="label">
                        到期时间
                        <a-tooltip>
                            <template slot="title">
                                留空则永不到期
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <!-- 按面板时区显示与选择（DBInbound._expiryTime）。不要「此刻」按钮，理由见 renew_modal.html。 -->
                    <a-date-picker :show-time="{ format: 'HH:mm' }" format="YYYY-MM-DD HH:mm"
                                   :show-today="false"
                                   v-model="dbInbound._expiryTime" style="width: 100%;"></a-date-picker>
                </a-form-item>
            </a-col>
            <a-col :span="12">
                <a-form-item>
                    <span slot="label">
                        地区限制
                        <a-tooltip>
                            <template slot="title">
                                只允许所选地区的 IP 使用该节点，其余一律拒绝。留空表示不限制。<br/>
                                可多选，例如同时选江苏与河南。<br/>
                                <b>启用后通过 IPv6 连接的客户端会被拒绝</b>。<br/>
                                地区数据来自「面板设置 → IP 归属地库」，未加载时这里是空的。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-select mode="multiple" v-model="dbInbound.regionList" style="width: 100%;"
                              :filter-option="(input, option) => option.componentOptions.children[0].text.indexOf(input) >= 0"
                              placeholder="留空表示不限制">
                        <a-select-option v-for="r in provinces" :key="r" :value="r">[[ r ]]</a-select-option>
                    </a-select>
                    <!-- 预演与建议都基于这个入站近 7 天的真实来源，新建的入站还没有数据 -->
                    <div v-if="dbInbound.id > 0" class="region-tools">
                        <a-button size="small" icon="experiment" :loading="inModal.preview.loading"
                                  :disabled="dbInbound.regionList.length === 0"
                                  @click="inModal.runPreview()">预演：会拦掉谁</a-button>
                        <a-button size="small" icon="bulb" :loading="inModal.preview.loading"
                                  @click="inModal.fillSuggestion()">按近 7 天填入建议</a-button>
                    </div>
                </a-form-item>
            </a-col>
        </a-row>
        <a-row v-if="dbInbound.regionList.length > 0" :gutter="16">
            <a-col :span="24">
                <a-form-item>
                    <span slot="label">
                        自动出差放行
                        <a-tooltip>
                            <template slot="title">
                                客户出差时不会来找你：开启后，家里一段时间没用、外地来源被地区规则拦下时，
                                自动放行那一个省一段时间，家里恢复使用就收回。<br/>
                                有每月天数、每周次数上限；发现家里与外地同时在用、或你手动收回过自动通行证，会暂停一段时间。<br/>
                                这些阈值在「面板设置 → 连接限制 → 自动出差放行」里调整。<br/>
                                需要开启访问日志；只放行国内 IPv4 来源。<br/>
                                「自动管理地区限制」总开关开着时，系统会替有地区限制的入站打开一次；之后你关掉就不再打开。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-switch v-model="dbInbound.autoTravel" aria-label="自动出差放行"></a-switch>
                </a-form-item>
            </a-col>
        </a-row>
        <!-- 预演结果：只读，不改任何东西。三种状态要分清：加载中 / 没有数据 / 出错。 -->
        <div v-if="inModal.preview.shown" class="region-preview" aria-live="polite">
            <div v-if="inModal.preview.error" class="region-preview-error" role="alert">
                <a-icon type="exclamation-circle"></a-icon> [[ inModal.preview.error ]]
            </div>
            <template v-else-if="inModal.preview.result">
                <div v-if="inModal.preview.result.totalHours === 0" class="cell-muted">
                    近 [[ inModal.preview.result.windowDays ]] 天没有这个入站的来源记录，无法预演。
                </div>
                <template v-else>
                    <div class="region-preview-head">
                        <template v-if="inModal.preview.result.blocked.length === 0 && inModal.preview.result.ipv6.length === 0">
                            <a-icon type="check-circle" class="tone-ok"></a-icon>
                            按 [[ inModal.preview.regionsText ]] 限制，近 [[ inModal.preview.result.windowDays ]] 天的来源都不会被拦。
                        </template>
                        <template v-else-if="inModal.preview.result.blocked.length === 0">
                            <a-icon type="warning" class="tone-warn"></a-icon>
                            按 [[ inModal.preview.regionsText ]] 限制，近 [[ inModal.preview.result.windowDays ]] 天的 IPv4 来源都不会被拦，
                            但 <b>[[ inModal.preview.result.ipv6.length ]]</b> 个 IPv6 来源将无法使用。
                        </template>
                        <template v-else>
                            <a-icon type="warning" class="tone-warn"></a-icon>
                            按 [[ inModal.preview.regionsText ]] 限制，近 [[ inModal.preview.result.windowDays ]] 天会拦掉
                            <b>[[ inModal.preview.result.blocked.length + inModal.preview.result.moreBlocked ]]</b> 个来源，
                            占流量 <b>[[ inModal.blockedShare() ]]</b>
                        </template>
                    </div>
                    <a-alert v-if="inModal.coexistingPicked().length" type="error" show-icon style="margin-bottom: 8px"
                             :message="'这些地区出现在异地同时使用记录里：' + inModal.coexistingPicked().join('、')"
                             description="可能是共享者所在地。直接保存等于把对方所在的地区一并放行，请判断后删掉不该放行的省份。">
                    </a-alert>
                    <table v-if="inModal.preview.result.blocked.length" class="region-preview-table">
                        <thead><tr><th scope="col">来源 IP</th><th scope="col">归属地</th><th scope="col">活跃小时</th><th scope="col">流量</th></tr></thead>
                        <tbody>
                        <tr v-for="b in inModal.preview.result.blocked" :key="b.ip">
                            <td class="cell-num">[[ b.ip ]]</td>
                            <td>[[ [b.province, b.city, b.isp].filter(x => x).join(' ') || '未知' ]]</td>
                            <td class="cell-num">[[ b.hours ]]</td>
                            <td class="cell-num">[[ sizeFormat(b.bytes) ]]</td>
                        </tr>
                        </tbody>
                    </table>
                    <div v-if="inModal.preview.result.moreBlocked" class="cell-muted">另有 [[ inModal.preview.result.moreBlocked ]] 个来源未列出</div>
                    <div v-if="inModal.preview.result.ipv6.length && inModal.preview.result.blocked.length" class="cell-muted">
                        另有 [[ inModal.preview.result.ipv6.length ]] 个 IPv6 来源：启用地区限制后它们无法使用（[[ inModal.preview.result.ipv6.map(x => x.ip).join('、') ]]）
                    </div>
                </template>
            </template>
        </div>
    </a-form>
</div>

<!-- 限制与配额 -->
<div class="form-section tone-amber">
    <div class="form-section-title">限制与配额</div>
    <a-form layout="horizontal">
        <a-row :gutter="16">
            <a-col :span="8">
                <a-form-item>
                    <span slot="label">
                        并发限制
                        <a-tooltip>
                            <template slot="title">
                                同一时间最多几个网络在用：同一个 Wi-Fi 下的多台设备算一个，IPv6 按 /64 算。<br/>
                                0 表示不限制。每个入站单独设，没有全局默认值。<br/>
                                按网络计而不是按连接数计：一个浏览器就会开几十条连接。<br/>
                                超额时拒绝后来的网络，已在线的人不受影响；被地区规则、机房拦截挡住的来源不占名额。<br/>
                                仅对 TCP 类传输（tcp / ws / grpc / h2）生效，mKCP、QUIC 无法统计。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-input-number v-model="dbInbound.concurrencyLimit" :min="0" :max="1000" :precision="0" style="width: 100%;"></a-input-number>
                </a-form-item>
            </a-col>
            <a-col :span="8">
                <a-form-item>
                    <span slot="label">
                        下行限速(Mbps)
                        <a-tooltip>
                            <template slot="title">
                                服务端发给客户端的方向，也就是用户的下载速度。0 表示不限制。<br/>
                                由 Linux 的 tc 实现，仅在 Linux 上生效。<br/>
                                未被限速的流量（包括 SSH）走不限速的默认队列，不受影响。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-input-number v-model="dbInbound.downMbit" :min="0" :max="100000" :precision="0" style="width: 100%;"></a-input-number>
                </a-form-item>
            </a-col>
            <a-col :span="8">
                <a-form-item>
                    <span slot="label">
                        上行限速(Mbps)
                        <a-tooltip>
                            <template slot="title">
                                客户端发给服务端的方向，也就是用户的上传速度。0 表示不限制。<br/>
                                上行限速需要 ifb 虚拟网卡（内核的 ifb 模块）。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-input-number v-model="dbInbound.upMbit" :min="0" :max="100000" :precision="0" style="width: 100%;"></a-input-number>
                </a-form-item>
            </a-col>
        </a-row>
        <!-- 端口转发（dokodemo-door）本来就不受机房拦截，不显示这个开关。 -->
        <a-row v-if="inbound.protocol !== Protocols.DOKODEMO" :gutter="16">
            <a-col :span="24">
                <a-form-item>
                    <span slot="label">
                        允许服务器来源（中转）
                        <a-tooltip>
                            <template slot="title">
                                用自己的服务器给这个节点做中转时打开：这个入站不再拦机房 / 云服务器来的连接。<br/>
                                只影响「面板设置 → 连接限制 → 拦截机房 / 云服务器来源」这一项；<br/>
                                并发限制、地区限制、25 端口拦截照旧；流量暴涨限速看下面那个开关。<br/>
                                中转机算一个网络：有几台中转机同时连，就把上面的并发限制设成几。<br/>
                                打开后别人也能用云服务器连这个节点，只给中转专用的入站打开。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-switch v-model="dbInbound.allowServerSources" aria-label="允许服务器来源（中转）"></a-switch>
                </a-form-item>
            </a-col>
        </a-row>
        <a-row :gutter="16">
            <a-col :span="24">
                <a-form-item>
                    <span slot="label">
                        不参与流量暴涨限速
                        <a-tooltip>
                            <template slot="title">
                                打开后这个入站不受「面板设置 → 连接限制 → 流量暴涨自动限速」影响，<br/>
                                当天用量再高也不会被自动限速；正在生效的限速保存后立即解除。<br/>
                                适合中转节点：后面挂着很多人，一限全体变慢。<br/>
                                并发限制、地区限制、上面填的上下行限速照旧。<br/>
                                和「允许服务器来源（中转）」是两个开关，各设各的。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-switch v-model="dbInbound.skipSpikeThrottle" aria-label="不参与流量暴涨限速"></a-switch>
                </a-form-item>
            </a-col>
        </a-row>
        <a-row :gutter="16">
            <a-col :span="24">
                <a-form-item>
                    <span slot="label">
                        流量自动重置
                        <a-tooltip>
                            <template slot="title">
                                到点把「已用流量」清零，按面板时区的 00:00 计。<br/>
                                「按订阅周期」取到期时间那一天的日号，每月同一天重置<br/>
                                （3 月 28 日到期就是每月 28 号），该日在当月不存在时<br/>
                                按当月最后一天算；需要先设置到期时间。<br/>
                                因跑满流量被自动停用的节点会在清零时一并重新启用；<br/>
                                手动停用的和已到期的不受影响。<br/>
                                只清已用流量，不影响用量图表的历史曲线。
                            </template>
                            <a-icon type="question-circle" theme="filled"></a-icon>
                        </a-tooltip>
                    </span>
                    <a-radio-group v-model="dbInbound.trafficResetMode" button-style="solid">
                        <a-radio-button :value="TRAFFIC_RESET_MODE.OFF">不重置</a-radio-button>
                        <a-radio-button :value="TRAFFIC_RESET_MODE.MONTHLY">每月 1 号</a-radio-button>
                        <a-radio-button :value="TRAFFIC_RESET_MODE.BILL_CYCLE"
                                        :disabled="!dbInbound.expiryTime">按订阅周期</a-radio-button>
                    </a-radio-group>
                </a-form-item>
            </a-col>
        </a-row>
        <!-- 到期时间被清空、而模式还停在「按订阅周期」时，保存会被后端拒绝。
             这里提前说明，免得管理员对着一个只写「需要先设置到期时间」的
             报错去找原因。 -->
        <a-row v-if="dbInbound.trafficResetMode === TRAFFIC_RESET_MODE.BILL_CYCLE && !dbInbound.expiryTime">
            <a-col :span="24">
                <a-alert type="warning" show-icon
                         message="「按订阅周期」需要到期时间"
                         description="当前没有设置到期时间，就没有订阅周期可依据。请先填到期时间，或改选「每月 1 号」/「不重置」——否则保存会被拒绝。">
                </a-alert>
            </a-col>
        </a-row>
    </a-form>
</div>

<!-- 协议参数 -->
<div class="form-section tone-indigo">
    <div class="form-section-title">协议参数</div>
    <!-- vmess settings -->
    <template v-if="inbound.protocol === Protocols.VMESS">
        {{template "form/vmess"}}
    </template>

    <!-- vless settings -->
    <template v-if="inbound.protocol === Protocols.VLESS">
        {{template "form/vless"}}
    </template>

    <!-- trojan settings -->
    <template v-if="inbound.protocol === Protocols.TROJAN">
        {{template "form/trojan"}}
    </template>

    <!-- shadowsocks -->
    <template v-if="inbound.protocol === Protocols.SHADOWSOCKS">
        {{template "form/shadowsocks"}}
    </template>

    <!-- dokodemo-door -->
    <template v-if="inbound.protocol === Protocols.DOKODEMO">
        {{template "form/dokodemo"}}
    </template>

    <!-- socks -->
    <template v-if="inbound.protocol === Protocols.SOCKS">
        {{template "form/socks"}}
    </template>

    <!-- http -->
    <template v-if="inbound.protocol === Protocols.HTTP">
        {{template "form/http"}}
    </template>
</div>

<!-- 传输与安全：原「传输」「安全层」「探测」三张卡片合并为一张，避免三套卡片头
     + 边框 + 内边距各自只装一两个控件。合并前三张卡片各自的可见性门槛
     （canEnableStream / canEnableTls / canSniffing）原样保留在对应内容块上，
     REALITY 设置原来嵌套在「安全层」卡片（canEnableTls）内部、自身又带
     canEnableStream 条件，这里用同样的嵌套（外层 canEnableTls 的 template
     包住安全层单选 + tlsSettings + realitySettings）保持复合条件不变。 -->
<div class="form-section tone-violet"
     v-if="inbound.canEnableStream() || inbound.canEnableTls() || inbound.canSniffing()">
    <div class="form-section-title">传输与安全</div>
    <!-- 传输 -->
    <template v-if="inbound.canEnableStream()">
        {{template "form/streamSettings"}}
    </template>

    <!-- 安全层 -->
    <template v-if="inbound.canEnableTls()">
        <a-form v-if="inbound.canEnableTls()" layout="horizontal">
            <a-row :gutter="16">
                <a-col :span="12">
                    <a-form-item>
                        <span slot="label">
                            安全层
                            <a-tooltip>
                                <template slot="title">
                                    reality 抗封锁最强且不需要自有域名；tls 需要域名和证书。<br/>
                                    reality 只支持 tcp 与 grpc 传输。
                                </template>
                                <a-icon type="question-circle" theme="filled"></a-icon>
                            </a-tooltip>
                        </span>
                        <a-radio-group v-model="inbound.stream.security" button-style="solid"
                                       @change="onSecurityChange">
                            <a-radio-button value="none">none</a-radio-button>
                            <a-radio-button value="tls">tls</a-radio-button>
                            <a-radio-button value="reality" :disabled="!inbound.canEnableReality()">reality</a-radio-button>
                        </a-radio-group>
                    </a-form-item>
                </a-col>
            </a-row>
        </a-form>

        <!-- tls settings -->
        <template v-if="inbound.canEnableTls()">
            {{template "form/tlsSettings"}}
        </template>

        <!-- reality settings（REALITY 属于安全层而不是传输方式，因此不放在「传输」块里）。
             可见性只跟安全层走（模板自身是 v-if="inbound.stream.isReality"），能不能选中
             reality 由上面单选的 canEnableReality() 决定。这里曾多套一层 canEnableStream()，
             它不含 Trojan：Trojan 选得中 reality 却看不到伪装目标与 serverNames，保存的
             配置被核心拒绝（TestRealitySettingsAreReachableForTrojan 守着）。 -->
        {{template "form/realitySettings"}}
    </template>

    <!-- 探测 -->
    <template v-if="inbound.canSniffing()">
        {{template "form/sniffing"}}
    </template>
</div>
{{end}}
