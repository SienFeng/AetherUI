{{define "qrcodeModal"}}
<a-modal id="qrcode-modal" v-model="qrModal.visible"
         :closable="true" width="420px" :footer="null">
    <template slot="title">
        <div class="modal-head">
            <span class="modal-icon tone-blue" aria-hidden="true"><a-icon type="qrcode"></a-icon></span>
            <span class="modal-head-text">
                <!-- 这个实例没设 [[ ]] 分隔符，用 v-text 绑定 -->
                <span class="modal-head-title" v-text="qrModal.title"></span>
                <span class="modal-head-sub">用客户端扫码导入</span>
            </span>
        </div>
    </template>
    <div class="qr-frame"><canvas id="qrCode" style="width: 100%; height: 100%;"></canvas></div>
    <!-- 视觉稿 v3：二维码下方是「分享文本 + 复制」一行，没有底栏。
         复制按钮保留 id="qr-modal-ok-btn"，ClipboardJS 按这个 id 绑定。 -->
    <div class="qr-copy">
        <a-input class="qr-text" :value="qrModal.copyText" read-only aria-label="分享内容"></a-input>
        <a-button type="primary" id="qr-modal-ok-btn" v-text="qrModal.okText"></a-button>
    </div>
</a-modal>

<script>

    const qrModal = {
        title: '',
        content: '',
        okText: '',
        copyText: '',
        qrcode: null,
        clipboard: null,
        visible: false,
        show: function (title='', content='', okText='{{ i18n "copy" }}', copyText='') {
            this.title = title;
            this.content = content;
            this.okText = okText;
            if (ObjectUtil.isEmpty(copyText)) {
                this.copyText = content;
            } else {
                this.copyText = copyText;
            }
            this.visible = true;
            qrModalApp.$nextTick(() => {
                if (this.clipboard === null) {
                    this.clipboard = new ClipboardJS('#qr-modal-ok-btn', {
                        text: () => this.copyText,
                    });
                    this.clipboard.on('success', () => app.$message.success('{{ i18n "copied" }}'));
                }
                if (this.qrcode === null) {
                    this.qrcode = new QRious({
                        element: document.querySelector('#qrCode'),
                        size: 260,
                        value: content,
                    });
                } else {
                    this.qrcode.value = content;
                }
            });
        },
        close: function () {
            this.visible = false;
        },
    };

    const qrModalApp = new Vue({
        el: '#qrcode-modal',
        data: {
            qrModal: qrModal,
        },
    });

</script>
{{end}}
